name: Prüfung vor dem Live-Gang

# Läuft bei jedem Push und Pull Request. Nur schnelle Tests ohne Browser,
# ohne Netz-Zugriff auf Datenbanken und ohne Geheimnisse.
# Ändert nichts am Live-Gang (GitHub Pages aus dem Branch main).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruefung:
    name: Schnelle Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax aller Skripte
        run: git ls-files -z "*.js" "*.mjs" | xargs -0 -n1 node --check
      - name: Linkprüfung (lokale Dateien)
        run: node scripts/linkpruefung.mjs
